# CSMJU Interactive Map subsystem manifest
# schema: standards/schemas/subsystem.schema.json

name: csmju-interactive-map
standards_version: "1.7.1"
conformance_level: L3

base_url: http://localhost:3202
core_hub_url: https://csmju2030.jowave.com
core_hub_web_url: https://csmju2030.jowave.com
callback_path: /auth/callback

public_endpoints:
  - GET /api/health
  - GET /auth/login
  - GET /auth/callback
  - POST /auth/logout

probes:
  collection: /api/v1/places
  not_found: /api/v1/places/99999999-9999-4999-8999-999999999999
  invalid_id: /api/v1/places/not-a-uuid
  create:
    path: /api/v1/places
    allowed_role: staff
    denied_role: guest
    invalid_body:
      nameTh: ""
    valid_body:
      nameTh: Conformance map point
      category: OTHER
      positionX: 10
      positionY: 10

owners:
  pl: "@csmju2030/pl-interactive-map"
  aie: "@csmju2030/aie-interactive-map"

display_name: "CSMJU Interactive Map"
repo: github.com/CSMJU2030/csmju-interactive-map
status: proposed

stack:
  frontend: "next@15"
  backend: "nest@11"
  database: "postgresql@16"

ui:
  design_system_version: "1.0.0"
  theme: light
  nav:
    - { label: "แผนที่ Interactive", path: "/map" }
    - { label: "สถานที่ทั้งหมด", path: "/locations" }
    - { label: "คณาจารย์และเจ้าหน้าที่", path: "/personnel" }
    - { label: "เกี่ยวกับระบบ", path: "/about" }
  local_components: []

default_role_mapping:
  student: STUDENT
  alumni: ALUMNI
  staff: STAFF
  lecturer: STAFF
  guest: ALUMNI
  admin: ADMIN

requested_exceptions: []
