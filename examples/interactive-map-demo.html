<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSMJU Interactive Map — Enhanced Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    /* ============================================================
       CSS CUSTOM PROPERTIES — Theme Tokens
       ============================================================ */
    :root {
      --bg: #f0f4f8;
      --bg-card: #ffffff;
      --bg-card-alt: #f8fafc;
      --text: #1e293b;
      --text-muted: #64748b;
      --text-subtle: #94a3b8;
      --border: #e2e8f0;
      --border-light: #f1f5f9;
      --brand-50: #eff6ff;
      --brand-100: #dbeafe;
      --brand-200: #bfdbfe;
      --brand-500: #3b82f6;
      --brand-600: #2563eb;
      --brand-700: #1d4ed8;
      --brand-800: #1e40af;
      --shadow: 0 4px 24px rgba(0,0,0,0.06);
      --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
      --radius: 16px;
      --radius-sm: 10px;
      --corridor-bg: #f1f5f9;
      --corridor-border: #cbd5e1;
      --corridor-grid: #e2e8f0;
      --wall: #94a3b8;
      --wall-inner: #cbd5e1;
      --compass-north: #ef4444;
      --selected-bg: #dbeafe;
      --selected-border: #2563eb;
      --selected-glow: rgba(37,99,235,0.25);
      --tooltip-bg: rgba(15,23,42,0.92);
      --tooltip-text: #f1f5f9;
      --particle-color: rgba(148,163,184,0.15);
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --bg-card: #1e293b;
      --bg-card-alt: #1a2332;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-subtle: #475569;
      --border: #334155;
      --border-light: #1e293b;
      --brand-50: #172554;
      --brand-100: #1e3a5f;
      --brand-200: #1e40af;
      --brand-500: #60a5fa;
      --brand-600: #3b82f6;
      --brand-700: #60a5fa;
      --brand-800: #93c5fd;
      --shadow: 0 4px 24px rgba(0,0,0,0.3);
      --shadow-lg: 0 12px 48px rgba(0,0,0,0.5);
      --corridor-bg: #1e293b;
      --corridor-border: #334155;
      --corridor-grid: #1e293b;
      --wall: #475569;
      --wall-inner: #334155;
      --selected-bg: #1e3a5f;
      --selected-border: #60a5fa;
      --selected-glow: rgba(96,165,250,0.3);
      --tooltip-bg: rgba(241,245,249,0.95);
      --tooltip-text: #0f172a;
      --particle-color: rgba(71,85,105,0.2);
    }

    /* ============================================================
       CATEGORY COLORS
       ============================================================ */
    :root {
      --cat-classroom: #3b82f6;
      --cat-classroom-fill: #dbeafe;
      --cat-classroom-stroke: #2563eb;
      --cat-lab: #14b8a6;
      --cat-lab-fill: #ccfbf1;
      --cat-lab-stroke: #0f766e;
      --cat-office: #a855f7;
      --cat-office-fill: #f3e8ff;
      --cat-office-stroke: #7e22ce;
      --cat-dept: #f59e0b;
      --cat-dept-fill: #fef3c7;
      --cat-dept-stroke: #b45309;
      --cat-meeting: #f43f5e;
      --cat-meeting-fill: #ffe4e6;
      --cat-meeting-stroke: #be123c;
      --cat-restroom: #64748b;
      --cat-restroom-fill: #e2e8f0;
      --cat-restroom-stroke: #475569;
      --cat-entrance: #22c55e;
      --cat-entrance-fill: #dcfce7;
      --cat-entrance-stroke: #15803d;
      --cat-other: #64748b;
      --cat-other-fill: #f1f5f9;
      --cat-other-stroke: #64748b;
    }

    [data-theme="dark"] {
      --cat-classroom-fill: #1e3a5f;
      --cat-classroom-stroke: #60a5fa;
      --cat-lab-fill: #134e4a;
      --cat-lab-stroke: #2dd4bf;
      --cat-office-fill: #3b0764;
      --cat-office-stroke: #c084fc;
      --cat-dept-fill: #451a03;
      --cat-dept-stroke: #fbbf24;
      --cat-meeting-fill: #4c0519;
      --cat-meeting-stroke: #fb7185;
      --cat-restroom-fill: #1e293b;
      --cat-restroom-stroke: #94a3b8;
      --cat-entrance-fill: #14532d;
      --cat-entrance-stroke: #4ade80;
      --cat-other-fill: #1e293b;
      --cat-other-stroke: #94a3b8;
    }

    /* ============================================================
       RESET & BASE
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      font-family: 'IBM Plex Sans Thai', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      transition: background 0.4s, color 0.4s;
      overflow-x: hidden;
    }

    /* ============================================================
       LAYOUT
       ============================================================ */
    .app-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--brand-600), var(--brand-800));
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 700;
      font-size: 18px;
      box-shadow: 0 4px 12px rgba(37,99,235,0.3);
    }

    .header h1 {
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .header h1 small {
      display: block;
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--text-muted);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ============================================================
       CONTROLS
       ============================================================ */
    .search-box {
      position: relative;
      width: 280px;
    }

    .search-box input {
      width: 100%;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0 40px 0 42px;
      font-size: 14px;
      background: var(--bg-card-alt);
      color: var(--text);
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
    }

    .search-box input:focus {
      border-color: var(--brand-500);
      box-shadow: 0 0 0 3px var(--selected-glow);
    }

    .search-box .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-subtle);
      pointer-events: none;
    }

    .search-box .clear-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-subtle);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      display: none;
    }

    .search-box .clear-btn.visible { display: block; }
    .search-box .clear-btn:hover { background: var(--border); }

    .theme-toggle {
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-card-alt);
      color: var(--text-muted);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 20px;
      transition: all 0.2s;
    }

    .theme-toggle:hover {
      border-color: var(--brand-500);
      color: var(--brand-600);
    }

    /* ============================================================
       FILTER CHIPS
       ============================================================ */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 0;
      overflow-x: auto;
      margin-bottom: 16px;
    }

    .filter-bar::-webkit-scrollbar { height: 0; }

    .filter-chip {
      white-space: nowrap;
      padding: 8px 18px;
      border-radius: 50px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s;
      user-select: none;
    }

    .filter-chip:hover {
      border-color: var(--brand-500);
      color: var(--brand-600);
    }

    .filter-chip.active {
      background: var(--brand-600);
      color: white;
      border-color: var(--brand-600);
      box-shadow: 0 2px 8px rgba(37,99,235,0.25);
    }

    .filter-chip .chip-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }

    /* ============================================================
       MAP CONTAINER
       ============================================================ */
    .main-content {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 20px;
    }

    @media (max-width: 960px) {
      .main-content { grid-template-columns: 1fr; }
      .search-box { width: 100%; }
    }

    .map-wrapper {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
      min-height: 560px;
    }

    .map-viewport {
      width: 100%;
      height: 100%;
      min-height: 560px;
      cursor: grab;
      overflow: hidden;
      position: relative;
    }

    .map-viewport:active { cursor: grabbing; }

    .map-viewport svg {
      width: 100%;
      height: 100%;
      transition: none;
    }

    /* ============================================================
       MAP CONTROLS OVERLAY
       ============================================================ */
    .map-controls {
      position: absolute;
      bottom: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
    }

    .map-ctrl-btn {
      width: 38px;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg-card);
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 18px;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .map-ctrl-btn:hover {
      background: var(--brand-50);
      border-color: var(--brand-500);
      color: var(--brand-600);
      box-shadow: 0 4px 12px rgba(37,99,235,0.15);
    }

    /* ============================================================
       ZOOM INDICATOR
       ============================================================ */
    .zoom-indicator {
      position: absolute;
      top: 16px;
      left: 16px;
      background: var(--tooltip-bg);
      color: var(--tooltip-text);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 10;
      pointer-events: none;
    }

    .zoom-indicator.visible { opacity: 1; }

    /* ============================================================
       TOOLTIP
       ============================================================ */
    .map-tooltip {
      position: fixed;
      background: var(--tooltip-bg);
      color: var(--tooltip-text);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      pointer-events: none;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.2s, transform 0.2s;
      z-index: 100;
      max-width: 280px;
      backdrop-filter: blur(8px);
    }

    .map-tooltip.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .map-tooltip .tt-code {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .map-tooltip .tt-name {
      font-weight: 500;
      margin-bottom: 6px;
    }

    .map-tooltip .tt-cat {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 50px;
      font-size: 11px;
      font-weight: 600;
    }

    .map-tooltip .tt-lecturers {
      margin-top: 8px;
      font-size: 12px;
      opacity: 0.85;
      border-top: 1px solid rgba(128,128,128,0.2);
      padding-top: 6px;
    }

    /* ============================================================
       SIDE PANEL
       ============================================================ */
    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .detail-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: all 0.3s;
    }

    .detail-card-header {
      padding: 20px;
      background: linear-gradient(135deg, var(--brand-50), var(--bg-card));
      border-bottom: 1px solid var(--border-light);
    }

    .detail-card-header .room-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--brand-700);
    }

    .detail-card-header .room-name {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .detail-card-body {
      padding: 20px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-light);
    }

    .detail-row:last-child { border-bottom: none; }

    .detail-label {
      font-size: 13px;
      color: var(--text-subtle);
      font-weight: 500;
    }

    .detail-value {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      text-align: right;
    }

    .cat-badge {
      padding: 3px 12px;
      border-radius: 50px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-active {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 12px;
      border-radius: 50px;
      font-size: 12px;
      font-weight: 600;
      background: #dcfce7;
      color: #15803d;
    }

    [data-theme="dark"] .status-active {
      background: #14532d;
      color: #4ade80;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: currentColor;
      border-radius: 50%;
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }

    .detail-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 32px;
      height: 32px;
      border: none;
      background: var(--border-light);
      border-radius: 8px;
      cursor: pointer;
      display: grid;
      place-items: center;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .detail-close:hover {
      background: var(--border);
      color: var(--text);
    }

    /* Empty state */
    .empty-state {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: grid;
      place-items: center;
      padding: 48px 24px;
      text-align: center;
    }

    .empty-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--border-light);
      display: grid;
      place-items: center;
      margin-bottom: 16px;
    }

    .empty-title {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .empty-desc {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* ============================================================
       MINI STATS
       ============================================================ */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 10px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px;
      text-align: center;
      transition: all 0.25s;
    }

    .stat-card:hover {
      border-color: var(--brand-500);
      box-shadow: 0 4px 16px var(--selected-glow);
      transform: translateY(-2px);
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--brand-700);
      font-family: 'JetBrains Mono', monospace;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
      margin-top: 2px;
    }

    /* ============================================================
       LEGEND
       ============================================================ */
    .legend-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .legend-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--text);
    }

    .legend-items {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .legend-item:hover { background: var(--border-light); }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 4px;
      border: 2px solid;
      flex-shrink: 0;
    }

    /* ============================================================
       SVG ROOM HOVER
       ============================================================ */
    .room-group { cursor: pointer; }
    .room-group .room-body {
      transition: filter 0.2s, transform 0.1s;
    }
    .room-group:hover .room-body {
      filter: brightness(0.93) saturate(1.2);
    }

    /* Selected room glow animation */
    @keyframes room-glow {
      0%, 100% { stroke-opacity: 0.6; }
      50% { stroke-opacity: 1; }
    }

    .room-selected-ring {
      animation: room-glow 2s ease-in-out infinite;
    }

    /* Search highlight animation */
    @keyframes search-highlight {
      0% { stroke-width: 0.5; stroke-opacity: 0; }
      30% { stroke-width: 2; stroke-opacity: 1; }
      100% { stroke-width: 0.5; stroke-opacity: 0; }
    }

    .room-search-highlight {
      animation: search-highlight 1.5s ease-out;
    }

    /* ============================================================
       ANIMATED CORRIDOR PARTICLES
       ============================================================ */
    @keyframes float-particle {
      0% { opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* ============================================================
       MINIMAP
       ============================================================ */
    .minimap-container {
      position: absolute;
      bottom: 16px;
      left: 16px;
      width: 140px;
      height: 84px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: var(--shadow);
      z-index: 10;
      opacity: 0.85;
      transition: opacity 0.2s;
    }

    .minimap-container:hover { opacity: 1; }

    .minimap-viewport {
      position: absolute;
      border: 1.5px solid var(--brand-500);
      background: var(--selected-glow);
      border-radius: 2px;
      pointer-events: none;
      transition: all 0.15s;
    }

    /* ============================================================
       TRANSITION ANIMATIONS
       ============================================================ */
    .fade-in {
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .slide-in {
      animation: slideIn 0.35s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- ==================== HEADER ==================== -->
    <header class="header fade-in">
      <div class="header-left">
        <div class="logo-icon">CS</div>
        <h1>
          CSMJU Interactive Map
          <small>สาขาวิชาวิทยาการคอมพิวเตอร์ มหาวิทยาลัยแม่โจ้</small>
        </h1>
      </div>
      <div class="header-right">
        <div class="search-box">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input id="searchInput" type="text" placeholder="ค้นหาห้อง สถานที่ อาจารย์..." />
          <button class="clear-btn" id="clearSearch" onclick="clearSearch()">✕</button>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" title="เปลี่ยนโหมดสว่าง/มืด" id="themeBtn">🌙</button>
      </div>
    </header>

    <!-- ==================== FILTER CHIPS ==================== -->
    <div class="filter-bar fade-in" id="filterBar">
      <!-- Generated by JS -->
    </div>

    <!-- ==================== MAIN CONTENT ==================== -->
    <div class="main-content">
      <!-- MAP -->
      <div class="map-wrapper fade-in">
        <div class="map-viewport" id="mapViewport">
          <svg id="mapSvg" viewBox="0 0 100 60" preserveAspectRatio="xMidYMid meet" role="img" aria-label="แผนผัง CSMJU">
            <!-- Defined in JS -->
          </svg>
        </div>

        <!-- Minimap -->
        <div class="minimap-container" id="minimap">
          <svg id="minimapSvg" viewBox="0 0 100 60" preserveAspectRatio="xMidYMid meet"></svg>
          <div class="minimap-viewport" id="minimapViewport"></div>
        </div>

        <!-- Zoom Controls -->

      { id: '13', room_code: 'CS302', name_th: 'ห้องปฏิบัติการ AI', name_en: 'AI Research Lab', category: 'COMPUTER_LAB', position_x: 44, position_y: 48, width: 14, height: 9, is_active: true, description: 'ห้องวิจัย Artificial Intelligence & Machine Learning', lecturers: [{ name_th: 'อ.ดร.ปิยะ สุขสำราญ' }], keywords: ['AI', 'lab'] },
      { id: '14', room_code: 'CS303', name_th: 'ห้องเรียนรวม', name_en: 'Lecture Hall', category: 'CLASSROOM', position_x: 60, position_y: 48, width: 16, height: 9, is_active: true, description: 'ห้องเรียนรวมขนาดใหญ่ ความจุ 120 ที่นั่ง', lecturers: [], keywords: ['lecture', 'hall'] },
      { id: '15', room_code: null, name_th: 'ทางเข้าหลัก', name_en: 'Main Entrance', category: 'ENTRANCE', position_x: 5, position_y: 42, width: 15, height: 8, is_active: true, description: 'ทางเข้าหลักอาคารเรียน', lecturers: [], keywords: ['entrance', 'door'] },
      { id: '16', room_code: 'OFF-03', name_th: 'ห้องพักอาจารย์ กลุ่ม C', name_en: 'Faculty Office C', category: 'LECTURER_OFFICE', position_x: 76, position_y: 25, width: 10, height: 10, is_active: true, description: 'ห้องพักอาจารย์กลุ่มวิชา Database & Web Technology', lecturers: [{ name_th: 'ผศ.สุวรรณี ดาวเรือง' }, { name_th: 'อ.มานพ พลอยงาม' }], keywords: ['office'] },
      { id: '17', room_code: 'SERVER', name_th: 'ห้อง Server', name_en: 'Server Room', category: 'OTHER', position_x: 76, position_y: 37, width: 10, height: 10, is_active: true, description: 'ห้อง Server & Network Operations Center', lecturers: [], keywords: ['server', 'network'] },
    ];

    const CORRIDOR_POINTS = [
      { x: 23, y: 3 }, { x: 23, y: 41 },
      { x: 28, y: 44.5 }, { x: 78, y: 44.5 },
      { x: 83, y: 41 }, { x: 83, y: 3 }
    ];
    const CORRIDOR_WIDTH = 4.5;

    const CATEGORIES = {
      CLASSROOM: { label: 'ห้องเรียน', icon: '📖', fill: 'var(--cat-classroom-fill)', stroke: 'var(--cat-classroom-stroke)', color: 'var(--cat-classroom)', chipBg: '#dbeafe', chipColor: '#1d4ed8' },
      COMPUTER_LAB: { label: 'ห้องปฏิบัติการ', icon: '💻', fill: 'var(--cat-lab-fill)', stroke: 'var(--cat-lab-stroke)', color: 'var(--cat-lab)', chipBg: '#ccfbf1', chipColor: '#0f766e' },
      LECTURER_OFFICE: { label: 'ห้องพักอาจารย์', icon: '👨‍🏫', fill: 'var(--cat-office-fill)', stroke: 'var(--cat-office-stroke)', color: 'var(--cat-office)', chipBg: '#f3e8ff', chipColor: '#7e22ce' },
      DEPARTMENT_OFFICE: { label: 'สำนักงาน', icon: '🏢', fill: 'var(--cat-dept-fill)', stroke: 'var(--cat-dept-stroke)', color: 'var(--cat-dept)', chipBg: '#fef3c7', chipColor: '#b45309' },
      MEETING_ROOM: { label: 'ห้องประชุม', icon: '🤝', fill: 'var(--cat-meeting-fill)', stroke: 'var(--cat-meeting-stroke)', color: 'var(--cat-meeting)', chipBg: '#ffe4e6', chipColor: '#be123c' },
      RESTROOM: { label: 'ห้องน้ำ', icon: '🚻', fill: 'var(--cat-restroom-fill)', stroke: 'var(--cat-restroom-stroke)', color: 'var(--cat-restroom)', chipBg: '#cffafe', chipColor: '#0891b2' },
      ENTRANCE: { label: 'ทางเข้า', icon: '🚪', fill: 'var(--cat-entrance-fill)', stroke: 'var(--cat-entrance-stroke)', color: 'var(--cat-entrance)', chipBg: '#dcfce7', chipColor: '#15803d' },
      FACILITY: { label: 'ลิฟต์ / สิ่งอำนวยความสะดวก', icon: '🛗', fill: 'var(--cat-facility-fill)', stroke: 'var(--cat-facility-stroke)', color: 'var(--cat-facility)', chipBg: '#ffedd5', chipColor: '#ea580c' },
      STUDENT_CLUB: { label: 'ห้องชมรม', icon: '👥', fill: 'var(--cat-club-fill)', stroke: 'var(--cat-club-stroke)', color: 'var(--cat-club)', chipBg: '#fce7f3', chipColor: '#db2777' },
      STORAGE: { label: 'ห้องเก็บของ', icon: '📦', fill: 'var(--cat-storage-fill)', stroke: 'var(--cat-storage-stroke)', color: 'var(--cat-storage)', chipBg: '#fef3c7', chipColor: '#d97706' },
      OTHER: { label: 'อื่น ๆ', icon: '📌', fill: 'var(--cat-other-fill)', stroke: 'var(--cat-other-stroke)', color: 'var(--cat-other)', chipBg: '#f1f5f9', chipColor: '#64748b' },
    };

    // ============================================================
    // STATE
    // ============================================================
    let currentFilter = 'ALL';
    let selectedPlace = null;
    let searchQuery = '';
    let viewBox = { x: 0, y: 0, w: 100, h: 60 };
    const defaultViewBox = { x: 0, y: 0, w: 100, h: 60 };
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let zoomLevel = 1;
    let zoomTimeout = null;

    // ============================================================
    // INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
      renderFilterChips();
      renderMap();
      renderMinimap();
      renderSidePanel();
      setupMapInteractions();
      setupSearch();
      startParticles();
    });

    // ============================================================
    // THEME
    // ============================================================
    function toggleTheme() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.documentElement.setAttribute('data-theme', isDark ? '' : 'dark');
      document.getElementById('themeBtn').textContent = isDark ? '🌙' : '☀️';
      renderMap();
      renderMinimap();
    }

    // ============================================================
    // SEARCH
    // ============================================================
    function setupSearch() {
      const input = document.getElementById('searchInput');
      const clearBtn = document.getElementById('clearSearch');
      input.addEventListener('input', (e) => {
        searchQuery = e.target.value.trim().toLowerCase();
        clearBtn.classList.toggle('visible', !!searchQuery);
        renderMap();
        renderSidePanel();
      });
    }

    function clearSearch() {
      searchQuery = '';
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearch').classList.remove('visible');
      selectedPlace = null;
      renderMap();
      renderSidePanel();
    }

    // ============================================================
    // FILTER CHIPS
    // ============================================================
    function renderFilterChips() {
      const bar = document.getElementById('filterBar');
      const allChip = `<button class="filter-chip active" data-filter="ALL" onclick="setFilter('ALL', this)">ทั้งหมด (${DEMO_PLACES.length})</button>`;

      const catChips = Object.entries(CATEGORIES).map(([key, cat]) => {
        const count = DEMO_PLACES.filter(p => p.category === key).length;
        if (count === 0) return '';
        return `<button class="filter-chip" data-filter="${key}" onclick="setFilter('${key}', this)">
          <span class="chip-dot" style="background: ${cat.color}"></span>${cat.label} (${count})
        </button>`;
      }).join('');

      bar.innerHTML = allChip + catChips;
    }

    function setFilter(filter, el) {
      currentFilter = filter;
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      selectedPlace = null;
      renderMap();
      renderSidePanel();
    }

    // ============================================================
    // FILTERED PLACES
    // ============================================================
    function getFilteredPlaces() {
      let places = DEMO_PLACES;
      if (currentFilter !== 'ALL') {
        places = places.filter(p => p.category === currentFilter);
      }
      if (searchQuery) {
        places = places.filter(p =>
          (p.name_th + ' ' + (p.name_en || '') + ' ' + (p.room_code || '') + ' ' + p.lecturers.map(l => l.name_th).join(' ') + ' ' + p.keywords.join(' ')).toLowerCase().includes(searchQuery)
        );
      }
      return places;
    }

    // ============================================================
    // RENDER MAP
    // ============================================================
    function renderMap() {
      const svg = document.getElementById('mapSvg');
      const places = getFilteredPlaces();
      const allPlaces = DEMO_PLACES;

      const corridorPath = CORRIDOR_POINTS.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x} ${p.y}`).join(' ');

      let html = `
        <defs>
          <pattern id="grid" width="4" height="4" patternUnits="userSpaceOnUse">
            <path d="M 4 0 L 0 0 0 4" fill="none" stroke="var(--corridor-border)" stroke-width="0.12" opacity="0.5"/>
          </pattern>
          <pattern id="tiles" width="2" height="2" patternUnits="userSpaceOnUse">
            <rect width="2" height="2" fill="var(--corridor-bg)"/>
            <path d="M 2 0 L 0 0 0 2" fill="none" stroke="var(--corridor-grid)" stroke-width="0.08"/>
          </pattern>
          <filter id="room-shadow" x="-15%" y="-15%" width="130%" height="140%">
            <feDropShadow dx="0" dy="0.4" stdDeviation="0.6" flood-color="rgba(0,0,0,0.1)"/>
          </filter>
          <filter id="selected-glow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="var(--selected-border)" flood-opacity="0.4"/>
          </filter>
          <linearGradient id="room-shine" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
            <stop offset="100%" stop-color="rgba(0,0,0,0.03)"/>
          </linearGradient>
          <linearGradient id="corridor-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="var(--corridor-bg)"/>
            <stop offset="100%" stop-color="var(--corridor-grid)"/>
          </linearGradient>
        </defs>

        <!-- Background Grid -->
        <rect width="100" height="60" fill="url(#grid)" rx="0"/>

        <!-- Building Perimeter -->
        <rect x="1" y="1" width="98" height="58" rx="4" fill="var(--bg-card)" stroke="var(--wall)" stroke-width="0.6"/>
        <rect x="1.8" y="1.8" width="96.4" height="56.4" rx="3.2" fill="none" stroke="var(--wall-inner)" stroke-width="0.25" stroke-dasharray="2 1"/>

        <!-- Building Title -->
        <text x="50" y="1.6" text-anchor="middle" font-size="1.1" font-weight="700" fill="var(--wall)" letter-spacing="0.5">
          CSMJU · INTERACTIVE MAP · แผนผังสาขาวิชาวิทยาการคอมพิวเตอร์
        </text>

        <!-- Corridors -->
        <path d="${corridorPath}" fill="none" stroke="var(--corridor-border)" stroke-width="${CORRIDOR_WIDTH + 1.8}" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="${corridorPath}" fill="none" stroke="url(#corridor-grad)" stroke-width="${CORRIDOR_WIDTH}" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="${corridorPath}" fill="none" stroke="var(--wall-inner)" stroke-width="0.2" stroke-dasharray="0.6 1" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Corridor Labels -->
        <g opacity="0.7">
          <text x="50" y="43.5" text-anchor="middle" font-size="0.9" font-weight="600" fill="var(--text-muted)">
            โถงทางเดินหลัก (Main Corridor)
          </text>
          <text x="23" y="22" text-anchor="middle" font-size="0.75" font-weight="500" fill="var(--wall)" transform="rotate(-90, 23, 22)">ทางเดินฝั่งตะวันตก</text>
          <text x="83" y="22" text-anchor="middle" font-size="0.75" font-weight="500" fill="var(--wall)" transform="rotate(90, 83, 22)">ทางเดินฝั่งตะวันออก</text>
        </g>

        <!-- Compass -->
        <g transform="translate(94,5)" opacity="0.8">
          <circle cx="0" cy="0" r="2.2" fill="var(--bg-card)" stroke="var(--wall-inner)" stroke-width="0.3"/>
          <polygon points="0,-1.6 -0.7,0.4 0,0" fill="var(--compass-north)"/>
          <polygon points="0,-1.6 0.7,0.4 0,0" fill="var(--wall)"/>
          <text x="0" y="-2.2" text-anchor="middle" font-size="0.75" font-weight="700" fill="var(--compass-north)">N</text>
        </g>

        <!-- Particle container -->
        <g id="particleLayer"></g>
      `;

      // Render dimmed places (filtered out)
      const filteredIds = new Set(places.map(p => p.id));
      allPlaces.forEach(place => {
        if (!filteredIds.has(place.id)) {
          const cat = CATEGORIES[place.category];
          const w = place.width ?? 12;
          const h = place.height ?? 8;
          html += `
            <g opacity="0.15">
              <rect x="${place.position_x}" y="${place.position_y}" width="${w}" height="${h}" rx="1.2" fill="${cat.fill}" stroke="${cat.stroke}" stroke-width="0.3"/>
            </g>
          `;
        }
      });

      // Render active places
      places.forEach(place => {
        const cat = CATEGORIES[place.category];
        const w = place.width ?? 12;
        const h = place.height ?? 8;
        const isSelected = selectedPlace && selectedPlace.id === place.id;
        const isSearchMatch = searchQuery && !isSelected;
        const codeFontSize = Math.min(2.0, w / 5.5);
        const nameFontSize = Math.min(1.0, w / 13);
        const label = place.room_code || place.name_th.slice(0, 10);
        const nameShort = place.name_th.length > 18 ? place.name_th.slice(0, 16) + '…' : place.name_th;

        html += `
          <g class="room-group" data-place-id="${place.id}"
             onmouseenter="showTooltip(event, '${place.id}')"
             onmousemove="moveTooltip(event)"
             onmouseleave="hideTooltip()"
             onclick="selectPlace('${place.id}')">
        `;

        // Selected glow ring
        if (isSelected) {
          html += `
            <rect class="room-selected-ring"
              x="${place.position_x - 1.2}" y="${place.position_y - 1.2}"
              width="${w + 2.4}" height="${h + 2.4}" rx="2.5"
              fill="none" stroke="var(--selected-border)" stroke-width="0.8"
              stroke-dasharray="2 1"/>
          `;
        }

        // Search highlight ring
        if (isSearchMatch) {
          html += `
            <rect class="room-search-highlight"
              x="${place.position_x - 0.8}" y="${place.position_y - 0.8}"
              width="${w + 1.6}" height="${h + 1.6}" rx="2"
              fill="none" stroke="${cat.stroke}" stroke-width="0.6"/>
          `;
        }

        // Room body
        html += `
          <rect class="room-body"
            x="${place.position_x}" y="${place.position_y}"
            width="${w}" height="${h}" rx="1.4"
            fill="${isSelected ? 'var(--selected-bg)' : cat.fill}"
            stroke="${isSelected ? 'var(--selected-border)' : cat.stroke}"
            stroke-width="${isSelected ? 0.8 : 0.45}"
            filter="${isSelected ? 'url(#selected-glow)' : 'url(#room-shadow)'}"/>

          <!-- Shine overlay -->
          <rect x="${place.position_x}" y="${place.position_y}"
            width="${w}" height="${h}" rx="1.4"
            fill="url(#room-shine)" pointer-events="none"/>

          <!-- Inner border -->
          <rect x="${place.position_x + 0.5}" y="${place.position_y + 0.5}"
            width="${w - 1}" height="${h - 1}" rx="0.9"
            fill="none" stroke="${isSelected ? 'var(--brand-200)' : cat.stroke}"
            stroke-width="0.12" opacity="0.3" pointer-events="none"/>

          <!-- Category icon -->
          <text x="${place.position_x + 1}" y="${place.position_y + 1.8}"
            font-size="1.3" pointer-events="none">${cat.icon}</text>

          <!-- Room code -->
          <text x="${place.position_x + w / 2}" y="${place.position_y + h / 2 - 0.3}"
            text-anchor="middle" font-size="${codeFontSize}" font-weight="700"
            fill="var(--text)" font-family="'JetBrains Mono', monospace"
            pointer-events="none">${label}</text>

          <!-- Room name -->
          <text x="${place.position_x + w / 2}" y="${place.position_y + h / 2 + nameFontSize + 0.8}"
            text-anchor="middle" font-size="${nameFontSize}" font-weight="500"
            fill="var(--text-muted)" pointer-events="none">${nameShort}</text>
        `;

        // Active indicator dot
        if (place.is_active) {
          html += `
            <circle cx="${place.position_x + w - 1.3}" cy="${place.position_y + 1.3}" r="0.6"
              fill="#22c55e" stroke="var(--bg-card)" stroke-width="0.25"/>
          `;
        }

        html += `</g>`;
      });

      // Footer
      html += `
        <text x="50" y="58.5" text-anchor="middle" font-size="1" fill="var(--wall)" opacity="0.7">
          CSMJU Interactive Map Demo · Enhanced Version · สาขาวิชาวิทยาการคอมพิวเตอร์ มหาวิทยาลัยแม่โจ้
        </text>
      `;

      svg.innerHTML = html;
      svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
      updateMinimap();
    }

    // ============================================================
    // RENDER MINIMAP
    // ============================================================
    function renderMinimap() {
      const svg = document.getElementById('minimapSvg');
      const corridorPath = CORRIDOR_POINTS.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x} ${p.y}`).join(' ');

      let html = `
        <rect width="100" height="60" fill="var(--bg-card-alt)" rx="0"/>
        <rect x="1" y="1" width="98" height="58" rx="3" fill="var(--bg-card)" stroke="var(--wall)" stroke-width="0.5"/>
        <path d="${corridorPath}" fill="none" stroke="var(--corridor-border)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      `;

      DEMO_PLACES.forEach(place => {
        const cat = CATEGORIES[place.category];
        const w = place.width ?? 12;
        const h = place.height ?? 8;
        const isSelected = selectedPlace && selectedPlace.id === place.id;
        html += `<rect x="${place.position_x}" y="${place.position_y}" width="${w}" height="${h}" rx="0.8"
          fill="${isSelected ? 'var(--selected-bg)' : cat.fill}" stroke="${isSelected ? 'var(--selected-border)' : cat.stroke}" stroke-width="0.3"/>`;
      });

      svg.innerHTML = html;
      updateMinimap();
    }

    function updateMinimap() {
      const vp = document.getElementById('minimapViewport');
      const container = document.getElementById('minimap');
      if (!container) return;
      const cw = container.offsetWidth;
      const ch = container.offsetHeight;
      const scaleX = cw / 100;
      const scaleY = ch / 60;
      vp.style.left = (viewBox.x * scaleX) + 'px';
      vp.style.top = (viewBox.y * scaleY) + 'px';
      vp.style.width = (viewBox.w * scaleX) + 'px';
      vp.style.height = (viewBox.h * scaleY) + 'px';
    }

    // ============================================================
    // TOOLTIP
    // ============================================================
    function showTooltip(event, placeId) {
      const place = DEMO_PLACES.find(p => p.id === placeId);
      if (!place) return;
      const cat = CATEGORIES[place.category];
      const tooltip = document.getElementById('tooltip');

      let lecturerHtml = '';
      if (place.lecturers.length) {
        lecturerHtml = `<div class="tt-lecturers">👨‍🏫 ${place.lecturers.map(l => l.name_th).join(', ')}</div>`;
      }

      tooltip.innerHTML = `
        <div class="tt-code">${place.room_code || '—'}</div>
        <div class="tt-name">${place.name_th}</div>
        <span class="tt-cat" style="background: ${cat.chipBg}; color: ${cat.chipColor}">${cat.icon} ${cat.label}</span>
        ${lecturerHtml}
      `;

      tooltip.classList.add('visible');
      moveTooltip(event);
    }

    function moveTooltip(event) {
      const tooltip = document.getElementById('tooltip');
      const x = event.clientX + 16;
      const y = event.clientY - 10;
      tooltip.style.left = Math.min(x, window.innerWidth - 300) + 'px';
      tooltip.style.top = Math.min(y, window.innerHeight - 120) + 'px';
    }

    function hideTooltip() {
      document.getElementById('tooltip').classList.remove('visible');
    }

    // ============================================================
    // SELECT PLACE
    // ============================================================
    function selectPlace(placeId) {
      const place = DEMO_PLACES.find(p => p.id === placeId);
      if (!place) return;

      selectedPlace = place;

      // Zoom to place
      const w = place.width ?? 12;
      const h = place.height ?? 8;
      viewBox = {
        x: Math.max(0, place.position_x - 15),
        y: Math.max(0, place.position_y - 10),
        w: 45,
        h: 30
      };
      zoomLevel = 100 / viewBox.w;

      const svg = document.getElementById('mapSvg');
      svg.style.transition = 'all 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
      svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
      setTimeout(() => { svg.style.transition = 'none'; }, 600);

      renderMap();
      renderMinimap();
      renderSidePanel();
      showZoomIndicator();
    }

    function deselectPlace() {
      selectedPlace = null;
      resetView();
      renderSidePanel();
    }

    // ============================================================
    // SIDE PANEL
    // ============================================================
    function renderSidePanel() {
      const panel = document.getElementById('sidePanel');
      const places = getFilteredPlaces();

      if (selectedPlace) {
        const cat = CATEGORIES[selectedPlace.category];
        panel.innerHTML = `
          <div class="detail-card slide-in" style="position:relative;">
            <button class="detail-close" onclick="deselectPlace()">✕</button>
            <div class="detail-card-header">
              <div class="room-code">${selectedPlace.room_code || selectedPlace.name_th}</div>
              <div class="room-name">${selectedPlace.name_th}</div>
              ${selectedPlace.name_en ? `<div style="font-size:12px;color:var(--text-subtle);margin-top:2px">${selectedPlace.name_en}</div>` : ''}
            </div>
            <div class="detail-card-body">
              <div class="detail-row">
                <span class="detail-label">ประเภท</span>
                <span class="cat-badge" style="background:${cat.chipBg};color:${cat.chipColor}">${cat.icon} ${cat.label}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">สถานะ</span>
                <span class="status-active"><span class="status-dot"></span>เปิดใช้งาน</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">รหัสห้อง</span>
                <span class="detail-value">${selectedPlace.room_code || '—'}</span>
              </div>
              ${selectedPlace.description ? `
              <div style="padding:12px 0;border-bottom:1px solid var(--border-light)">
                <div class="detail-label" style="margin-bottom:6px">📝 รายละเอียด</div>
                <div style="font-size:13px;color:var(--text-muted);line-height:1.6">${selectedPlace.description}</div>
              </div>` : ''}
              ${selectedPlace.lecturers.length ? `
              <div style="padding:12px 0">
                <div class="detail-label" style="margin-bottom:8px">👨‍🏫 อาจารย์ประจำ</div>
                ${selectedPlace.lecturers.map(l => `
                  <div style="display:flex;align-items:center;gap:8px;padding:6px 0">
                    <div style="width:32px;height:32px;border-radius:50%;background:var(--brand-100);display:grid;place-items:center;font-size:14px;color:var(--brand-700);font-weight:600">${l.name_th.charAt(0)}</div>
                    <span style="font-size:13px;font-weight:500">${l.name_th}</span>
                  </div>
                `).join('')}
              </div>` : ''}
            </div>
          </div>
        `;
      } else {
        panel.innerHTML = `
          <div class="empty-state fade-in">
            <div class="empty-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--text-subtle)" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            </div>
            <div class="empty-title">เลือกสถานที่บนแผนที่</div>
            <div class="empty-desc">คลิกที่ห้องบนแผนที่เพื่อดูรายละเอียด</div>
          </div>

          <div class="stats-bar fade-in">
            <div class="stat-card">
              <div class="stat-value">${DEMO_PLACES.length}</div>
              <div class="stat-label">สถานที่ทั้งหมด</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${DEMO_PLACES.filter(p => p.category === 'COMPUTER_LAB').length}</div>
              <div class="stat-label">ห้องปฏิบัติการ</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${DEMO_PLACES.filter(p => p.category === 'CLASSROOM').length}</div>
              <div class="stat-label">ห้องเรียน</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${DEMO_PLACES.filter(p => p.lecturers.length > 0).length}</div>
              <div class="stat-label">มีอาจารย์ประจำ</div>
            </div>
          </div>

          <div class="legend-card fade-in">
            <div class="legend-title">🏷️ สัญลักษณ์หมวดหมู่</div>
            <div class="legend-items">
              ${Object.entries(CATEGORIES).map(([key, cat]) => `
                <div class="legend-item" onclick="setFilterByKey('${key}')">
                  <span class="legend-dot" style="background:${cat.chipBg};border-color:${cat.chipColor}"></span>
                  <span>${cat.icon} ${cat.label}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
    }

    function setFilterByKey(key) {
      currentFilter = key;
      selectedPlace = null;
      document.querySelectorAll('.filter-chip').forEach(c => {
        c.classList.toggle('active', c.dataset.filter === key);
      });
      renderMap();
      renderSidePanel();
    }

    // ============================================================
    // ZOOM & PAN
    // ============================================================
    function setupMapInteractions() {
      const viewport = document.getElementById('mapViewport');
      const svg = document.getElementById('mapSvg');

      // Mouse wheel zoom
      viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const delta = e.deltaY > 0 ? 1.15 : 0.87;
        const rect = svg.getBoundingClientRect();
        const mx = ((e.clientX - rect.left) / rect.width) * viewBox.w + viewBox.x;
        const my = ((e.clientY - rect.top) / rect.height) * viewBox.h + viewBox.y;

        const newW = Math.max(15, Math.min(100, viewBox.w * delta));
        const newH = Math.max(9, Math.min(60, viewBox.h * delta));
        viewBox.x = mx - (mx - viewBox.x) * (newW / viewBox.w);
        viewBox.y = my - (my - viewBox.y) * (newH / viewBox.h);
        viewBox.w = newW;
        viewBox.h = newH;

        clampViewBox();
        zoomLevel = 100 / viewBox.w;
        svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
        updateMinimap();
        showZoomIndicator();
      }, { passive: false });

      // Pan
      viewport.addEventListener('mousedown', (e) => {
        if (e.target.closest('.room-group')) return;
        isDragging = true;
        dragStart = { x: e.clientX, y: e.clientY };
        viewport.style.cursor = 'grabbing';
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const rect = svg.getBoundingClientRect();
        const dx = (e.clientX - dragStart.x) / rect.width * viewBox.w;
        const dy = (e.clientY - dragStart.y) / rect.height * viewBox.h;
        viewBox.x -= dx;
        viewBox.y -= dy;
        clampViewBox();
        svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
        dragStart = { x: e.clientX, y: e.clientY };
        updateMinimap();
      });

      window.addEventListener('mouseup', () => {
        isDragging = false;
        viewport.style.cursor = 'grab';
      });

      // Touch support
      let touchStart = null;
      let touchDist = null;

      viewport.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        } else if (e.touches.length === 2) {
          touchDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
        }
      }, { passive: true });

      viewport.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && touchStart) {
          const rect = svg.getBoundingClientRect();
          const dx = (e.touches[0].clientX - touchStart.x) / rect.width * viewBox.w;
          const dy = (e.touches[0].clientY - touchStart.y) / rect.height * viewBox.h;
          viewBox.x -= dx;
          viewBox.y -= dy;
          clampViewBox();
          svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
          touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
          updateMinimap();
        } else if (e.touches.length === 2 && touchDist) {
          const newDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const scale = touchDist / newDist;
          viewBox.w = Math.max(15, Math.min(100, viewBox.w * scale));
          viewBox.h = Math.max(9, Math.min(60, viewBox.h * scale));
          clampViewBox();
          zoomLevel = 100 / viewBox.w;
          svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
          touchDist = newDist;
          updateMinimap();
          showZoomIndicator();
        }
      }, { passive: true });

      viewport.addEventListener('touchend', () => {
        touchStart = null;
        touchDist = null;
      });
    }

    function clampViewBox() {
      viewBox.x = Math.max(-5, Math.min(105 - viewBox.w, viewBox.x));
      viewBox.y = Math.max(-5, Math.min(65 - viewBox.h, viewBox.y));
    }

    function zoomIn() {
      const cx = viewBox.x + viewBox.w / 2;
      const cy = viewBox.y + viewBox.h / 2;
      viewBox.w = Math.max(15, viewBox.w * 0.75);
      viewBox.h = Math.max(9, viewBox.h * 0.75);
      viewBox.x = cx - viewBox.w / 2;
      viewBox.y = cy - viewBox.h / 2;
      clampViewBox();
      zoomLevel = 100 / viewBox.w;
      const svg = document.getElementById('mapSvg');
      svg.style.transition = 'all 0.3s ease-out';
      svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
      setTimeout(() => { svg.style.transition = 'none'; }, 350);
      updateMinimap();
      showZoomIndicator();
    }

    function zoomOut() {
      const cx = viewBox.x + viewBox.w / 2;
      const cy = viewBox.y + viewBox.h / 2;
      viewBox.w = Math.min(100, viewBox.w * 1.35);
      viewBox.h = Math.min(60, viewBox.h * 1.35);
      viewBox.x = cx - viewBox.w / 2;
      viewBox.y = cy - viewBox.h / 2;
      clampViewBox();
      zoomLevel = 100 / viewBox.w;
      const svg = document.getElementById('mapSvg');
      svg.style.transition = 'all 0.3s ease-out';
      svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
      setTimeout(() => { svg.style.transition = 'none'; }, 350);
      updateMinimap();
      showZoomIndicator();
    }

    function resetView() {
      viewBox = { ...defaultViewBox };
      zoomLevel = 1;
      const svg = document.getElementById('mapSvg');
      svg.style.transition = 'all 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
      svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
      setTimeout(() => { svg.style.transition = 'none'; }, 550);
      renderMap();
      updateMinimap();
      showZoomIndicator();
    }

    function showZoomIndicator() {
      const indicator = document.getElementById('zoomIndicator');
      indicator.textContent = `${Math.round(zoomLevel * 100)}%`;
      indicator.classList.add('visible');
      clearTimeout(zoomTimeout);
      zoomTimeout = setTimeout(() => {
        indicator.classList.remove('visible');
      }, 1500);
    }

    // ============================================================
    // ANIMATED PARTICLES ON CORRIDOR
    // ============================================================
    function startParticles() {
      setInterval(() => {
        const layer = document.getElementById('particleLayer');
        if (!layer) return;

        // Pick random segment of corridor
        const segIdx = Math.floor(Math.random() * (CORRIDOR_POINTS.length - 1));
        const p1 = CORRIDOR_POINTS[segIdx];
        const p2 = CORRIDOR_POINTS[segIdx + 1];

        const particle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        particle.setAttribute('r', String(0.3 + Math.random() * 0.4));
        particle.setAttribute('fill', 'var(--particle-color)');
        particle.style.animation = `float-particle ${2 + Math.random() * 3}s ease-in-out forwards`;

        // Animate along segment
        const animX = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
        animX.setAttribute('attributeName', 'cx');
        animX.setAttribute('from', String(p1.x + (Math.random() - 0.5) * 2));
        animX.setAttribute('to', String(p2.x + (Math.random() - 0.5) * 2));
        animX.setAttribute('dur', `${2 + Math.random() * 3}s`);
        animX.setAttribute('fill', 'freeze');

        const animY = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
        animY.setAttribute('attributeName', 'cy');
        animY.setAttribute('from', String(p1.y + (Math.random() - 0.5) * 2));
        animY.setAttribute('to', String(p2.y + (Math.random() - 0.5) * 2));
        animY.setAttribute('dur', `${2 + Math.random() * 3}s`);
        animY.setAttribute('fill', 'freeze');

        particle.appendChild(animX);
        particle.appendChild(animY);
        layer.appendChild(particle);

        // Clean up old particles
        setTimeout(() => { particle.remove(); }, 5500);
      }, 400);
    }
  </script>
