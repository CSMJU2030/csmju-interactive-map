services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4202
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/csmju_interactive_map_db?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3202}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3202}
      SUBSYSTEM_ID: csmju-interactive-map
      CORE_HUB_URL: ${CORE_HUB_URL:-https://csmju2030.jowave.com}
      CORE_HUB_JWKS_URL: ${CORE_HUB_JWKS_URL:-https://csmju2030.jowave.com/api/v1/.well-known/jwks.json}
      CORE_HUB_WEB_URL: ${CORE_HUB_WEB_URL:-https://csmju2030.jowave.com}
      CORE_HUB_ISSUER: ${CORE_HUB_ISSUER:-core-hub}
      CORE_HUB_AUDIENCE: ${CORE_HUB_AUDIENCE:-csmju2030}
    ports:
      - "4202:4202"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4202/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: csmju_interactive_map_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Use 5433 on the host to avoid colliding with a locally installed PostgreSQL.
      - "5433:5432"
    volumes:
      - interactive-map-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d csmju_interactive_map_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  interactive-map-postgres:
